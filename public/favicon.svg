<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  <g fill="url(#brand-gradient)">
    <!-- Halter esquerdo -->
    <rect x="8" y="10" width="3" height="12" rx="1"/>
    <rect x="6" y="8" width="7" height="3" rx="1"/>
    <rect x="5" y="11" width="2" height="10" rx="1"/>
    <!-- Halter direito -->
    <rect x="21" y="10" width="3" height="12" rx="1"/>
    <rect x="19" y="8" width="7" height="3" rx="1"/>
    <rect x="25" y="11" width="2" height="10" rx="1"/>
    <!-- Barra central -->
    <rect x="11" y="13" width="10" height="2" rx="1"/>
  </g>
</svg>